  <section class="section fade-up" id="feedback">
    <div class="section-eyebrow">Feedback</div>
    <h2 class="section-title">Enjoying the <em>site?</em></h2>
    <p class="section-sub">Tap the heart, then tell me what worked for you.</p>
    <div class="fb">
      <div class="fb-like">
        <button class="fb-heart" id="fbHeart" type="button" aria-pressed="false" aria-label="Like this portfolio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4 2.4h4C14.6 6.1 16 5 18 5c3.3 0 5.1 3.400 3.600 6.800C19.500 16.400 12 21 12 21z"/></svg>
          <span class="fb-burst" aria-hidden="true"></span>
        </button>
        <div class="fb-count"><b id="fbCount">0</b><span id="fbCountLbl">likes</span></div>
      </div>
      <form class="fb-form" id="fbForm" novalidate>
        <fieldset class="fb-chips"><legend>What did you like?</legend>
          <label><input type="checkbox" value="Design"><span>Design</span></label>
          <label><input type="checkbox" value="Animations"><span>Animations</span></label>
          <label><input type="checkbox" value="Case studies"><span>Case studies</span></label>
          <label><input type="checkbox" value="Music player"><span>Music player</span></label>
          <label><input type="checkbox" value="Loader"><span>Loader</span></label>
          <label><input type="checkbox" value="Speed"><span>Speed</span></label>
        </fieldset>
        <div class="fb-row">
          <input id="fbName" type="text" maxlength="40" placeholder="Your name (optional)" autocomplete="name" aria-label="Your name">
        </div>
        <textarea id="fbBody" rows="3" maxlength="400" placeholder="Say a few words…" aria-label="Your comment"></textarea>
        <div class="fb-foot"><span class="fb-err" id="fbErr" role="alert"></span><button class="fb-send" type="submit">Post comment</button></div>
      </form>
      <ul class="fb-list" id="fbList" aria-live="polite"></ul>
      <p class="fb-note">Likes and comments are saved in this browser for now.</p>
    </div>
  </section>
