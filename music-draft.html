<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Press play — draft</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ga:.14;            /* glass fill */
  --gb:30px;           /* glass blur */
  --ease:cubic-bezier(.22,1,.36,1);
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Inter,system-ui,sans-serif;
}
html,body{height:100%}
body{background:#0b0a0d;color:#fff;font-family:var(--sf);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ---------- backdrop ---------- */
.bg{position:fixed;inset:-25%;z-index:-2;background:url(assets/music/cover.jpg) center/cover;filter:blur(60px) saturate(2.1) brightness(.95);transform:scale(1.1);transition:filter 1s ease;animation:drift 40s ease-in-out infinite alternate}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 20% 10%,rgba(255,140,60,.25),transparent 70%),radial-gradient(50% 50% at 90% 90%,rgba(60,120,255,.18),transparent 70%)}
@keyframes drift{from{transform:scale(1.1) translate(-2%,-1%)}to{transform:scale(1.2) translate(2%,2%)}}
body[data-track="1"] .bg{filter:blur(60px) saturate(2.2) brightness(1.05) hue-rotate(-20deg)}
body[data-track="2"] .bg{filter:blur(60px) saturate(1.8) brightness(.85) hue-rotate(155deg)}
.scrim{position:fixed;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.3))}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,calc(var(--ga) + .08)),rgba(255,255,255,var(--ga)) 55%,rgba(255,255,255,calc(var(--ga) - .04)));
  -webkit-backdrop-filter:blur(var(--gb)) saturate(190%);backdrop-filter:blur(var(--gb)) saturate(190%);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.28),transparent 45%),radial-gradient(80% 60% at 100% 100%,rgba(255,255,255,.08),transparent 60%)}
.press{transition:transform .35s var(--ease)}
.press:active{transform:scale(.93)}

/* ---------- layout ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px)}
.sheet{width:min(1040px,100%);border-radius:44px;padding:14px clamp(16px,3vw,34px) clamp(20px,3vw,34px);background:rgba(20,18,24,.18);-webkit-backdrop-filter:blur(40px) saturate(160%);backdrop-filter:blur(40px) saturate(160%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 40px 100px rgba(0,0,0,.5)}
.grabber{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(16px,2.4vw,28px)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.seg{display:flex;padding:4px;border-radius:100px;position:relative}
.seg button{position:relative;z-index:1;padding:9px 22px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.68);transition:color .3s}
.seg button[aria-selected="true"]{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:100px;background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.25);transition:transform .5s var(--ease),width .5s var(--ease)}

.body{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:stretch}
.left{display:flex;flex-direction:column;gap:20px}
.art{aspect-ratio:1;border-radius:26px;background:url(assets/music/cover.jpg) center/cover;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);transform:scale(.86);transition:transform .8s var(--ease),filter .8s}
body[data-track="1"] .art,body[data-track="1"] .thumb-art{filter:hue-rotate(-20deg) saturate(1.3) brightness(1.1)}
body[data-track="2"] .art,body[data-track="2"] .thumb-art{filter:hue-rotate(155deg) saturate(.95) brightness(.95)}
.is-playing .art{transform:scale(1)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta h1{font-size:clamp(21px,2.4vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.meta p{font-size:16px;color:rgba(255,255,255,.62);margin-top:2px}
.meta .round{width:36px;height:36px;flex:none}
.meta .round svg{width:16px;height:16px}

/* dock (controls) */
.dock{border-radius:30px;padding:16px 20px 18px}
.scrub{--p:0%}
.scrub input{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;display:block}
.scrub input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.28) var(--p));transition:height .2s}
.scrub input::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.scrub input::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
.scrub input:hover::-webkit-slider-runnable-track{height:9px}
.scrub input:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,34px);margin:10px 0 14px}
.ctrl button{display:grid;place-items:center;border-radius:50%}
.ctrl .sm svg{width:34px;height:34px}
.ctrl .play{width:76px;height:76px}
.ctrl .play svg{width:34px;height:34px}
.ctrl .sm{width:56px;height:56px}
.vol{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7)}
.vol svg{width:16px;height:16px;flex:none}
.vol input{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer;--p:80%}
.vol input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,rgba(255,255,255,.9) var(--p),rgba(255,255,255,.28) var(--p))}
.vol input::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.vol input::-moz-range-progress{height:6px;border-radius:3px;background:rgba(255,255,255,.9)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}

/* right column */
.right{position:relative;min-height:440px;border-radius:30px;overflow:hidden}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(12px) scale(.98);transition:opacity .5s var(--ease),transform .6s var(--ease),visibility .5s}
.pane.on{opacity:1;visibility:visible;transform:none}
.lyrics{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 80%,transparent 100%);overflow:hidden}
.ly-inner{padding:0 8px;transition:transform .8s var(--ease)}
.ly{font-size:clamp(26px,3.1vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.14;margin:0 0 26px;color:#fff;opacity:.3;filter:blur(2.2px);transform:scale(.94);transform-origin:0 50%;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .6s var(--ease);cursor:pointer}
.ly.past{opacity:.22}
.ly.active{opacity:1;filter:none;transform:none}
.ly:hover{opacity:.7}
.ly.dots{letter-spacing:.3em}
.queue{padding:6px;overflow:auto}
.q{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px;border-radius:20px;transition:background .3s}
.q:hover{background:rgba(255,255,255,.1)}
.q.on{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.thumb-art{width:56px;height:56px;border-radius:12px;background:url(assets/music/cover.jpg) center/cover;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.q:nth-child(2) .thumb-art{filter:hue-rotate(-20deg) saturate(1.3) brightness(1.1)}
.q:nth-child(3) .thumb-art{filter:hue-rotate(155deg) saturate(.95) brightness(.95)}
.q b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.q span{font-size:14px;color:rgba(255,255,255,.6)}
.q .len{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.6)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;margin-right:4px}
.eq i{width:3px;background:#fff;border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.is-playing .q.on .eq{display:flex}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* tweak panel */
.tweak{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);z-index:5;white-space:nowrap}
.tweak input{-webkit-appearance:none;appearance:none;width:130px;height:18px;background:transparent;--p:35%}
.tweak input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.28) var(--p))}
.tweak input::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.tweak input::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
.tweak input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tweak input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.chip{position:fixed;top:14px;left:14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:100px;z-index:5;color:rgba(255,255,255,.9)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* phone / narrow */
@media(max-width:860px){
  .body{grid-template-columns:1fr;gap:20px}
  .left{max-width:340px;margin:0 auto;width:100%}
  .right{min-height:320px;height:320px}
  .sheet{border-radius:36px}
  .stage{padding-bottom:16px}
  .tweak{position:static;transform:none;margin:0 auto 28px;width:max-content}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@media(prefers-reduced-transparency:reduce){.glass,.sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(40,36,46,.92)}}
</style>
</head>
<body data-track="0">
<div class="bg" aria-hidden="true"></div><div class="scrim" aria-hidden="true"></div>
<div class="chip glass">Draft</div>

<div class="stage" id="stage">
  <main class="sheet" id="sheet" aria-label="Music player">
    <div class="grabber" aria-hidden="true"></div>
    <header class="top">
      <button class="round glass press" aria-label="Close" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5l6 6 6-6"/></svg></button>
      <div class="seg glass" role="tablist" aria-label="View" id="seg">
        <span class="thumb" id="segThumb"></span>
        <button role="tab" aria-selected="true" data-pane="lyrics" type="button">Lyrics</button>
        <button role="tab" aria-selected="false" data-pane="queue" type="button">Up Next</button>
      </div>
      <button class="round glass press" aria-label="More" type="button"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="16" cy="10" r="1.7"/></svg></button>
    </header>

    <div class="body">
      <section class="left">
        <div class="art" id="art" role="img" aria-label="Album artwork: a lit city apartment at sunset"></div>
        <div class="meta">
          <div><h1 id="title">Midnight Commit</h1><p id="artist">Paras Nagda · Portfolio Sessions</p></div>
          <button class="round glass press" aria-label="Favourite" type="button" id="fav"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 2.8l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 8.1l5-.7z"/></svg></button>
        </div>
        <div class="dock glass">
          <div class="scrub" id="scrub"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="tEl">0:00</span><span id="tRe">-1:44</span></div></div>
          <div class="ctrl">
            <button class="sm press" id="prev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.5a1 1 0 0 1 2 0v5.2l9.2-5.1c.9-.5 2 .1 2 1.1v10.6c0 1-1.1 1.6-2 1.1L8 13.3v5.2a1 1 0 0 1-2 0z"/></svg></button>
            <button class="play glass press" id="play" type="button" aria-label="Play" aria-pressed="false">
              <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2c0-1 1.1-1.6 1.9-1.1l9.4 6.1c.8.5.8 1.7 0 2.2l-9.4 6.1c-.8.5-1.9-.1-1.9-1.1z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>
            </button>
            <button class="sm press" id="next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5.5a1 1 0 0 0-2 0v5.2L6.8 5.6c-.9-.5-2 .1-2 1.1v10.6c0 1 1.1 1.6 2 1.1l9.2-5.1v5.2a1 1 0 0 0 2 0z"/></svg></button>
          </div>
          <div class="vol">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 8v4h3l4 3.5v-11L6 8z"/></svg>
            <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 8v4h3l4 3.5v-11L6 8z"/><path d="M13 6.5a5 5 0 0 1 0 7M15.2 4.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
        </div>
      </section>

      <section class="right glass">
        <div class="pane lyrics on" id="paneLyrics" aria-label="Lyrics"><div class="ly-inner" id="lyInner"></div></div>
        <div class="pane queue" id="paneQueue" aria-label="Up next"></div>
      </section>
    </div>
  </main>
</div>

<div class="tweak glass"><span>Clear</span><input type="range" id="glass" min="0" max="100" value="35" aria-label="Glass tint"><span>Tinted</span></div>
<p class="sr" id="status" role="status" aria-live="polite"></p>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---------- tracks ---------- */
  var TRACKS=[
    {title:'Midnight Commit',dur:104,bpm:74,cut:3200,
     chords:[[62,65,69,72],[59,62,65,67],[60,64,67,71],[57,60,64,67]],roots:[38,43,36,45],pent:[74,77,81,84,86],
     lyrics:[[0,'· · ·'],[8,'City lights hum through the glass'],[16,'Cursor blinking, coffee’s cold'],[24,'Wireframes breathing on the screen'],[32,'Every pixel finds its place'],[40,'Design that works, quietly'],[48,'Marketing that sells, softly'],[56,'Ship it before the sunrise'],[64,'Then let the needle fall'],[72,'Vinyl crackle, slow and warm'],[80,'Nothing left to prove tonight'],[88,'Just a good idea and a good light'],[98,'· · ·']]},
    {title:'Golden Hour',dur:96,bpm:68,cut:3000,
     chords:[[65,69,72,76],[64,67,71,74],[62,65,69,72],[60,64,67,71]],roots:[41,40,38,36],pent:[72,76,79,81,84],
     lyrics:[[0,'· · ·'],[8,'Sun slides low across the desk'],[16,'Feedback lands, a little kind'],[24,'Version three feels almost right'],[32,'Move the margin, hold the line'],[40,'Colour warms the empty frame'],[48,'Small details do the talking'],[56,'Export, breathe, and let it go'],[64,'Orange sky behind the glass'],[72,'Every client gets a smile'],[80,'Close the laptop, hear the room'],[90,'· · ·']]},
    {title:'Rainy Window',dur:100,bpm:62,cut:2500,
     chords:[[57,60,64,71],[65,69,72,76],[60,64,67,71],[67,71,74,76]],roots:[33,41,36,43],pent:[69,72,74,76,79],
     lyrics:[[0,'· · ·'],[8,'Rain keeps time on the window pane'],[17,'Deadlines blur like city lights'],[26,'One more sketch before I sleep'],[35,'Grid and type and quiet space'],[44,'Nothing loud, but all of it matters'],[53,'Somewhere a prototype is loading'],[62,'Somewhere a button feels just right'],[71,'Let the record spin a little longer'],[80,'We’ll fix the rest tomorrow'],[91,'· · ·']]}
  ];
  function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

  /* ---------- lo-fi engine ---------- */
  var audio=(function(){
    var ctx,master,vol,bus,echo,melodyIn,noiseBuf,timer,step=0,next=0,volume=.8;
    var BPM=74,STEP=60/BPM/4,chords,roots,pent;
    function mtof(m){return 440*Math.pow(2,(m-69)/12)}
    function init(){
      if(ctx){ctx.resume();return}
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      ctx=new AC();ctx.resume();
      var u=ctx.createBufferSource();u.buffer=ctx.createBuffer(1,1,22050);u.connect(ctx.destination);u.start(0);
      master=ctx.createGain();master.gain.value=0;
      var comp=ctx.createDynamicsCompressor();
      vol=ctx.createGain();vol.gain.value=volume;
      master.connect(comp);comp.connect(vol);vol.connect(ctx.destination);
      bus=ctx.createBiquadFilter();bus.type='lowpass';bus.frequency.value=3200;bus.connect(master);
      echo=ctx.createDelay(1);echo.delayTime.value=STEP*6;
      var fb=ctx.createGain();fb.gain.value=.32;var wet=ctx.createGain();wet.gain.value=.3;
      echo.connect(fb);fb.connect(echo);echo.connect(wet);wet.connect(bus);
      melodyIn=ctx.createGain();melodyIn.connect(bus);melodyIn.connect(echo);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      var hiss=ctx.createBufferSource();hiss.buffer=noiseBuf;hiss.loop=true;
      var hf=ctx.createBiquadFilter();hf.type='highpass';hf.frequency.value=4500;
      var hg=ctx.createGain();hg.gain.value=.014;
      hiss.connect(hf);hf.connect(hg);hg.connect(master);hiss.start();
    }
    function noise(t,dur,type,freq,gain,dest){
      var s=ctx.createBufferSource();s.buffer=noiseBuf;
      var f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;
      var g=ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      s.connect(f);f.connect(g);g.connect(dest||bus);s.start(t,Math.random()*1.5);s.stop(t+dur+.02);
    }
    function tone(t,midi,dur,type,gain,dest){
      var o=ctx.createOscillator();o.type=type;o.frequency.value=mtof(midi);o.detune.value=(Math.random()-.5)*14;
      var g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
      o.connect(g);g.connect(dest||bus);o.start(t);o.stop(t+dur+.05);
    }
    function kick(t){
      var o=ctx.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
      var g=ctx.createGain();g.gain.setValueAtTime(.85,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
      o.connect(g);g.connect(bus);o.start(t);o.stop(t+.32);
    }
    function schedule(s,t){
      var bar=(s>>4)%4,sb=s%16,tt=t+(sb%2?STEP*.22:0),ch=chords[bar];
      if(sb===0||sb===10){
        var long=sb===0;
        ch.forEach(function(n){tone(tt,n,long?1.8:.9,'triangle',.05);tone(tt,n+12,long?1.4:.7,'sine',.018)});
        tone(tt,roots[bar],long?.7:.4,'sine',.26);
      }
      if(sb===0||sb===10||(sb===7&&Math.random()<.4))kick(tt);
      if(sb===4||sb===12){noise(tt,.17,'bandpass',1800,.4);noise(tt,.09,'highpass',700,.12)}
      if(sb%2===0)noise(tt,.05,'highpass',7500,.05+Math.random()*.05);
      else if(Math.random()<.25)noise(tt,.03,'highpass',8500,.035);
      if(sb%2===0&&Math.random()<.3)tone(tt,pent[(Math.random()*pent.length)|0],.8,'sine',.06,melodyIn);
      if(Math.random()<.3)noise(t+Math.random()*STEP,.012,'highpass',1500,.05+Math.random()*.12,master);
    }
    function sched(){while(next<ctx.currentTime+.18){schedule(step,next);next+=STEP;step++}}
    return {
      prime:init,
      start:function(T,resume){
        init();if(!ctx)return;ctx.resume();
        BPM=T.bpm;STEP=60/BPM/4;chords=T.chords;roots=T.roots;pent=T.pent;
        bus.frequency.value=T.cut;echo.delayTime.value=STEP*6;
        var now=ctx.currentTime;if(!resume)step=0;next=now+.08;
        master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);
        master.gain.linearRampToValueAtTime(.85,now+1.2);
        clearInterval(timer);timer=setInterval(sched,40);
      },
      stop:function(){
        if(!ctx)return;clearInterval(timer);
        var now=ctx.currentTime;
        master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);
        master.gain.linearRampToValueAtTime(0,now+.6);
      },
      volume:function(v){volume=v;if(vol)vol.gain.setTargetAtTime(v,ctx.currentTime,.03)}
    };
  })();

  /* ---------- UI ---------- */
  var body=document.body,sheet=$('sheet'),playBtn=$('play'),seek=$('seek'),scrub=$('scrub'),status=$('status');
  var iPlay=playBtn.querySelector('.i-play'),iPause=playBtn.querySelector('.i-pause');
  var cur=0,elapsed=0,playing=false,last=0,rafId=0,lyEls=[],activeLine=-1;

  function buildLyrics(){
    var inner=$('lyInner');inner.innerHTML='';lyEls=[];activeLine=-1;
    TRACKS[cur].lyrics.forEach(function(l,i){
      var p=document.createElement('p');p.className='ly'+(l[1].charAt(0)==='·'?' dots':'');p.textContent=l[1];
      p.addEventListener('click',function(){setElapsed(l[0])});
      inner.appendChild(p);lyEls.push(p);
    });
    inner.style.paddingTop='30%';inner.style.paddingBottom='60%';
  }
  function buildQueue(){
    var q=$('paneQueue');q.innerHTML='';
    TRACKS.forEach(function(t,i){
      var b=document.createElement('button');b.type='button';b.className='q'+(i===cur?' on':'');
      b.innerHTML='<span class="thumb-art"></span><span><b></b><span>Paras Nagda</span></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="len"></span>';
      b.querySelector('b').textContent=t.title;b.querySelector('.len').textContent=fmt(t.dur);
      b.addEventListener('click',function(){setTrack(i,true)});
      q.appendChild(b);
    });
  }
  function lyricsScroll(){
    var box=$('paneLyrics'),inner=$('lyInner'),el=lyEls[Math.max(0,activeLine)];
    if(!el)return;
    var y=box.clientHeight*.36-(el.offsetTop+el.offsetHeight/2);
    inner.style.transform='translateY('+y+'px)';
  }
  function paint(){
    var T=TRACKS[cur],p=elapsed/T.dur;
    seek.value=Math.round(p*1000);
    var pct=(p*100)+'%';scrub.style.setProperty('--p',pct);
    $('tEl').textContent=fmt(elapsed);$('tRe').textContent='-'+fmt(T.dur-elapsed);
    var a=0;T.lyrics.forEach(function(l,i){if(elapsed>=l[0])a=i});
    if(a!==activeLine){
      activeLine=a;
      lyEls.forEach(function(el,i){el.classList.toggle('active',i===a);el.classList.toggle('past',i<a)});
      lyricsScroll();
    }
  }
  function setElapsed(s){elapsed=Math.max(0,Math.min(TRACKS[cur].dur-.1,s));activeLine=-1;paint()}
  function setPlayingUI(on){
    sheet.classList.toggle('is-playing',on);
    iPlay.style.display=on?'none':'';iPause.style.display=on?'':'none';
    playBtn.setAttribute('aria-label',on?'Pause':'Play');playBtn.setAttribute('aria-pressed',on?'true':'false');
  }
  function loop(n){
    if(!playing){rafId=0;return}
    var dt=Math.min(.1,(n-last)/1000);last=n;
    elapsed+=dt;
    if(elapsed>=TRACKS[cur].dur){setTrack((cur+1)%TRACKS.length,true);}
    else paint();
    rafId=requestAnimationFrame(loop);
  }
  function play(){
    if(playing)return;
    try{audio.start(TRACKS[cur],true)}catch(e){}
    playing=true;setPlayingUI(true);last=performance.now();
    if(!rafId)rafId=requestAnimationFrame(loop);
    status.textContent='Playing '+TRACKS[cur].title;
  }
  function pause(){
    if(!playing)return;
    audio.stop();playing=false;setPlayingUI(false);status.textContent='Paused';
  }
  function setTrack(i,autoplay){
    var was=playing;
    audio.stop();
    cur=i;elapsed=0;body.setAttribute('data-track',i);
    $('title').textContent=TRACKS[i].title;
    buildLyrics();buildQueue();paint();
    playing=false;
    if(was||autoplay){setTimeout(function(){try{audio.start(TRACKS[cur],false)}catch(e){}},60);playing=true;setPlayingUI(true);last=performance.now();if(!rafId)rafId=requestAnimationFrame(loop)}
    else setPlayingUI(false);
  }

  playBtn.addEventListener('click',function(){audio.prime();playing?pause():play()});
  $('next').addEventListener('click',function(){audio.prime();setTrack((cur+1)%TRACKS.length,playing)});
  $('prev').addEventListener('click',function(){audio.prime();if(elapsed>4)setElapsed(0);else setTrack((cur+TRACKS.length-1)%TRACKS.length,playing)});
  seek.addEventListener('input',function(){setElapsed(seek.value/1000*TRACKS[cur].dur)});
  $('vol').addEventListener('input',function(e){var v=e.target.value;e.target.style.setProperty('--p',v+'%');audio.volume(v/100)});
  $('fav').addEventListener('click',function(){var p=$('fav').querySelector('path');var on=p.getAttribute('fill')==='currentColor';p.setAttribute('fill',on?'none':'currentColor')});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'&&e.target.type==='range')return;
    if(e.code==='Space'){e.preventDefault();audio.prime();playing?pause():play()}
  });

  /* segmented control */
  var seg=$('seg'),thumb=$('segThumb'),tabs=[].slice.call(seg.querySelectorAll('button'));
  function placeThumb(){var t=seg.querySelector('[aria-selected="true"]');thumb.style.width=t.offsetWidth+'px';thumb.style.transform='translateX('+(t.offsetLeft-4)+'px)'}
  tabs.forEach(function(b){b.addEventListener('click',function(){
    tabs.forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});
    $('paneLyrics').classList.toggle('on',b.dataset.pane==='lyrics');
    $('paneQueue').classList.toggle('on',b.dataset.pane==='queue');
    placeThumb();
    if(b.dataset.pane==='lyrics')setTimeout(lyricsScroll,60);
  })});

  /* glass tint slider: clear <-> tinted */
  $('glass').addEventListener('input',function(e){
    var v=+e.target.value;e.target.style.setProperty('--p',v+'%');
    document.documentElement.style.setProperty('--ga',(.04+v/100*.26).toFixed(3));
    document.documentElement.style.setProperty('--gb',(14+v/100*30).toFixed(0)+'px');
  });

  buildLyrics();buildQueue();paint();
  window.addEventListener('resize',function(){placeThumb();lyricsScroll()});
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(function(){placeThumb();lyricsScroll()});
  setTimeout(function(){placeThumb();lyricsScroll()},50);
})();
</script>
</body>
</html>
